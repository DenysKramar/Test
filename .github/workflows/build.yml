name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17


      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (release)
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  trigger_gitlab:
    name: Trigger GitLab Pipeline
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository (for GitLab sync)
        uses: actions/checkout@v3

      - name: Set up Git for GitLab sync
        run: |
          git config --global user.name "Denys Kramar"
          git config --global user.email "denys.kramar@onix-systems.com"

      - name: Push changes to GitLab
        run: |
          git remote set-url origin https://oauth2:${{ glptt-a2d76965ee2147ad4673d042403400769f29ab1c }}@gitlab.com/onix-systems/android-sonar.git
          git push origin HEAD:WebHookTest  

      - name: Trigger GitLab Pipeline
        run: |
          curl -X POST \
            -H "Authorization: token glptt-a2d76965ee2147ad4673d042403400769f29ab1c" \
            -d '{"ref": "WebHookTest"}' \
            "https://gitlab.com/api/v4/projects/1324/trigger/pipeline"
        env:
          GITLAB_TOKEN: ${{ glptt-a2d76965ee2147ad4673d042403400769f29ab1c }}
          GITLAB_PROJECT_ID: ${{ 1324 }}

